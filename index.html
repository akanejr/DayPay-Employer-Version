    <!-- No maximum-scale, no user-scalable=no: those stop a reader pinching a
         payslip or a roster to read it, which fails WCAG 1.4.4 (AA) — and this
         product holds itself to AA in tests/design.test.js. The usual reason an
         app sets them is the double-tap zoom delay, and index.css already removes
         that properly with `touch-action: manipulation` on every button. kiosk.html
         never had them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DayPay — Know what your work is worth.</title>
    <meta name="theme-color" content="#0B1B32" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DayPay" />
    <meta name="description" content="DayPay — Know what your work is worth. Attendance, roster and day-rate pay: weekend and holiday at 2×, overtime, monthly payslips, and a site kiosk for workers with no phone." />
  </head>
